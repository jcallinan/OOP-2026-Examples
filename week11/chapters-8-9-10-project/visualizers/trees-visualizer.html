<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Trees Visualizer</title>
<style>body{font-family:system-ui;background:linear-gradient(135deg,#f2fff2,#dcffdc);padding:24px;color:#132}.wrap{max-width:1000px;margin:auto;display:grid;gap:14px}.panel{background:#fff;border:2px solid #a8d8a8;border-radius:16px;padding:16px}.controls{display:flex;gap:8px;flex-wrap:wrap}input,button{padding:10px;border-radius:10px;border:1px solid #9bb}button{background:#2f8f2f;color:#fff;font-weight:700}code{display:block;white-space:pre-wrap;background:#f5fff5;padding:10px;border-radius:10px}</style></head>
<body><div class="wrap"><div class="panel"><h1>🌳 Binary Search Tree Visualizer</h1><div class="controls"><input id="value" type="number" value="11"/><button onclick="insertValue()">Insert</button><button onclick="seed()">Seed Example</button></div></div><div class="panel"><h3>Tree (sideways)</h3><code id="tree"></code></div><div class="panel"><h3>Traversals</h3><div id="traversals"></div></div></div>
<script>
const tree={key:null,left:null,right:null};
function insert(node,val){if(node.key===null){node.key=val;return;} if(val<node.key){if(!node.left)node.left={key:val,left:null,right:null}; else insert(node.left,val);} else {if(!node.right)node.right={key:val,left:null,right:null}; else insert(node.right,val);}}
function print(node,depth=0){if(!node||node.key===null)return ''; return print(node.right,depth+1)+`${' '.repeat(depth*4)}${node.key}\n`+print(node.left,depth+1);} 
function walk(node,order,res=[]){if(!node)return res; if(order==='pre')res.push(node.key); walk(node.left,order,res); if(order==='in')res.push(node.key); walk(node.right,order,res); if(order==='post')res.push(node.key); return res;}
function render(){document.getElementById('tree').textContent=print(tree)||'Empty tree'; document.getElementById('traversals').innerHTML=`In-order: ${walk(tree,'in').join(', ')}<br>Pre-order: ${walk(tree,'pre').join(', ')}<br>Post-order: ${walk(tree,'post').join(', ')}`;}
function insertValue(){insert(tree,Number(document.getElementById('value').value)); render();}
function seed(){[11,7,15,5,3,9,8,10,13,12,14,20,18,25,6].forEach(v=>insert(tree,v)); render();}
render();
</script></body></html>
