<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Set Visualizer</title><style>
body{font-family:system-ui,sans-serif;background:linear-gradient(135deg,#eefbf3,#d7f4ea);color:#173a2e;padding:24px}.wrap{max-width:1100px;margin:auto;display:grid;gap:16px}.panel{background:#fff;border-radius:18px;padding:18px;border:2px solid #9be7c4;box-shadow:0 12px 28px rgba(22,102,73,.12)}.hero{background:linear-gradient(90deg,#52b788,#2d6a4f);color:#fff}.controls{display:flex;gap:8px;flex-wrap:wrap}input,button{padding:10px;border-radius:10px;border:1px solid #74c69d}button{background:#40916c;color:#fff;font-weight:700}.ghost{background:#fff;color:#2d6a4f}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.pill{display:inline-block;padding:8px 10px;border-radius:999px;background:#d8f3dc;margin:4px;border:1px solid #74c69d}.result{min-height:70px}.note{line-height:1.7;color:#37594d}
</style></head><body><div class="wrap"><div class="panel hero"><h1>🟢 Set Visualizer</h1><p>Week 10 • unique values, union, intersection, difference</p></div><div class="panel"><div class="controls"><input id="leftValue" placeholder="add to Set A" value="JavaScript"><button onclick="addToSet('a')">Add A</button><input id="rightValue" placeholder="add to Set B" value="SQL"><button onclick="addToSet('b')">Add B</button><button class="ghost" onclick="seedSets()">Seed Example</button></div></div><div class="grid"><div class="panel"><h3>Set A</h3><div id="setA"></div></div><div class="panel"><h3>Set B</h3><div id="setB"></div></div><div class="panel result"><h3>Operations</h3><div id="ops"></div></div></div><div class="panel"><p class="note">This demonstrates the textbook rule that a <b>set keeps only distinct values</b>. Re-adding an item has no effect, which is why sets are great for deduplication and membership checks.</p></div></div><script>
const a=new Set(),b=new Set(); function renderSet(id,set){document.getElementById(id).innerHTML=[...set].map(v=>`<span class="pill">${v}</span>`).join('')||'<i>Empty set</i>'} function recalc(){const union=[...new Set([...a,...b])];const inter=[...a].filter(v=>b.has(v));const diff=[...a].filter(v=>!b.has(v));document.getElementById('ops').innerHTML=`<p><b>A ∪ B</b>: ${union.join(', ')||'∅'}</p><p><b>A ∩ B</b>: ${inter.join(', ')||'∅'}</p><p><b>A - B</b>: ${diff.join(', ')||'∅'}</p>`;renderSet('setA',a);renderSet('setB',b)} function addToSet(which){const input=which==='a'?leftValue:rightValue;const target=which==='a'?a:b; const v=input.value.trim(); if(!v)return; target.add(v); input.value=''; recalc()} function seedSets(){a.clear();b.clear();['JavaScript','Angular','SQL','AWS'].forEach(v=>a.add(v));['SQL','Python','AWS','Statistics'].forEach(v=>b.add(v));recalc()} recalc();
</script></body></html>
