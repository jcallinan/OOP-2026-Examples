<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Dictionary Visualizer</title><style>
body{font-family:system-ui,sans-serif;background:linear-gradient(135deg,#f6f3ff,#e5dbff);color:#2a1f52;padding:24px}.wrap{max-width:1000px;margin:auto;display:grid;gap:16px}.panel{background:#fff;border:2px solid #c8b6ff;border-radius:18px;padding:18px;box-shadow:0 12px 28px rgba(91,57,160,.12)}.hero{background:linear-gradient(90deg,#9f86c0,#5e548e);color:#fff}.controls{display:flex;flex-wrap:wrap;gap:8px}input,button{padding:10px;border-radius:10px;border:1px solid #b8a0e3}button{background:#5e548e;color:#fff;font-weight:700}.table{display:grid;gap:10px}.row{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;background:#f8f6ff;border-radius:12px;padding:10px;border:1px solid #ddd2ff}.note{line-height:1.7;color:#534a75}
</style></head><body><div class="wrap"><div class="panel hero"><h1>📘 Dictionary Visualizer</h1><p>Week 10 • key-value pairs for direct lookup</p></div><div class="panel"><div class="controls"><input id="keyInput" value="hello" placeholder="key"><input id="valueInput" value="olá" placeholder="value"><button onclick="upsert()">Set Pair</button><button onclick="seedDictionary()">Seed Translations</button></div></div><div class="panel"><h3>Entries</h3><div class="table" id="table"></div></div><div class="panel"><p class="note">A dictionary stores <b>key-value pairs</b>. The textbook uses this to model translation lookup: the key identifies the word, and the value stores the translation.</p></div></div><script>
const dict=new Map(); function render(){const table=document.getElementById('table'); if(!dict.size){table.innerHTML='<i>No entries yet.</i>'; return;} table.innerHTML=''; [...dict.entries()].forEach(([k,v])=>{const row=document.createElement('div'); row.className='row'; row.innerHTML=`<div><b>${k}</b></div><div>${v}</div><button onclick="removeEntry('${encodeURIComponent(k)}')">Delete</button>`; table.appendChild(row);});} function upsert(){const k=keyInput.value.trim(), v=valueInput.value.trim(); if(!k||!v)return; dict.set(k,v); render()} function seedDictionary(){dict.clear(); [['hello','olá'],['book','livro'],['computer','computador'],['cat','gato']].forEach(([k,v])=>dict.set(k,v)); render()} function removeEntry(key){dict.delete(decodeURIComponent(key)); render()} render();
</script></body></html>
